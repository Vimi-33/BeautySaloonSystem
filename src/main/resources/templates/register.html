<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="backdrop">
    <div class="blob blob--gold"></div>
    <div class="blob blob--teal"></div>
</div>

<div class="page">
    <script>
        (function () {
            var dir = sessionStorage.getItem('authPageEnterDirection');
            if (dir === 'left' || dir === 'right') {
                document.currentScript.parentElement.classList.add('enter-from-' + dir);
                sessionStorage.removeItem('authPageEnterDirection');
            }
        })();
    </script>

    <div class="brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 21C12 21 5 16.5 5 10.8C5 7.9 7.2 6 9.6 6C10.9 6 11.6 6.6 12 7.2C12.4 6.6 13.1 6 14.4 6C16.8 6 19 7.9 19 10.8C19 16.5 12 21 12 21Z" fill="currentColor" opacity="0.85"/>
            <path d="M12 7.2C12 4.5 10.2 3 8 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
            <path d="M12 7.2C12 4.5 13.8 3 16 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
        </svg>
        Aurelia Beauty Salon
    </div>

    <div class="auth-card">

        <!-- IMAGE (left) -->
        <div class="panel-image">
            <div class="overlay-glass">
                <h2>Already a member?</h2>
                <p>Log in to manage your appointments, favorites, and member perks.</p>
                <button type="button" class="btn-ghost nav-trigger" th:attr="data-href=@{/login}" data-exit="right">Log in</button>
            </div>
        </div>

        <!-- FORM (right) -->
        <div class="panel-form">
            <form class="form" th:action="@{/register}" th:object="${customer}" method="post">
                <h2>Create an account</h2>

                <div th:if="${errorMessage}" class="alert alert--error" th:text="${errorMessage}"></div>

                <input class="field" type="text" th:field="*{fullName}" placeholder="Full name" aria-label="Full name" required>
                <input class="field" type="email" th:field="*{email}" placeholder="Email" aria-label="Email" required>
                <input class="field" type="text" th:field="*{phone}" placeholder="Phone" aria-label="Phone" required>
                <input class="field" type="password" th:field="*{password}" placeholder="Password" aria-label="Password" required>

                <button class="btn-primary" type="submit">Register</button>


            </form>
        </div>

    </div>
</div>

<script th:src="@{/script.js}"></script>
</body>
</html>
